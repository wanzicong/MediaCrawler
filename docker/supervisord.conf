[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/app/logs/xvfb_stdout.log
stderr_logfile=/app/logs/xvfb_stderr.log

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -nopw -localhost
priority=15
autorestart=true
stdout_logfile=/app/logs/x11vnc_stdout.log
stderr_logfile=/app/logs/x11vnc_stderr.log

[program:websockify]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
priority=16
autorestart=true
stdout_logfile=/app/logs/websockify_stdout.log
stderr_logfile=/app/logs/websockify_stderr.log

[program:mcp]
command=uv run python -m mcp_server
directory=/app
priority=20
autorestart=true
environment=DISPLAY=":99",MEDIACRAWLER_DOCKER="true",PYTHONIOENCODING="utf-8"
stdout_logfile=/app/logs/mcp_stdout.log
stderr_logfile=/app/logs/mcp_stderr.log

[program:api]
command=uv run uvicorn api.main:app --host 0.0.0.0 --port 8080
directory=/app
priority=30
autorestart=true
environment=DISPLAY=":99",MEDIACRAWLER_DOCKER="true",PYTHONIOENCODING="utf-8"
stdout_logfile=/app/logs/api_stdout.log
stderr_logfile=/app/logs/api_stderr.log
