services:
  mediacrawler:
    build: .
    container_name: mc
    environment:
      MEDIACRAWLER_DOCKER: "true"
      DISPLAY: :99
    volumes:
      # 登录态(关键:重建容器不丢登录)
      - ./browser_data:/app/browser_data
      # 爬取结果 + 二维码
      - ./data:/app/data
      # 日志
      - ./logs:/app/logs
    ports:
      - "8765:8765"   # MCP 服务
      - "8080:8080"   # API + WebUI
    # Chrome 在容器内必须给足共享内存,否则渲染大页面崩溃
    shm_size: 2gb
    restart: unless-stopped
